[project]
name = "delaycast-backend"
version = "0.1.0"
description = "Compact local National Rail delay-risk portfolio backend"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "pandas>=2.2,<3",
    "pydantic>=2.10,<3",
    "scikit-learn>=1.6,<2",
    "uvicorn>=0.30,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/delaycast"]
